# llmtap price table — USD per 1,000,000 tokens.
#
# ---------------------------------------------------------------------------
# VERIFY THESE NUMBERS BEFORE TRUSTING A COST DASHBOARD.
#
# The values below were collected from public pricing summaries on the date in
# "updated" and are a starting point, not a source of truth. Rates change, they
# differ by region and tier, and an enterprise agreement can change them
# entirely. Check them against:
#
#   https://openai.com/api/pricing/
#   https://www.anthropic.com/pricing
#
# A model that is absent from this table is not billed at zero — llmtap simply
# does not report a cost for it, and logs the missing entry once.
# ---------------------------------------------------------------------------

