version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose      # a leaked response body in a proxy leaks a connection
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # Table-driven tests read better without these.
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
