name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No QEMU needed for the arm64 image, which matters because a good share
      # of developer laptops are arm64 now: the Dockerfile cross-compiles on
      # the runner's own architecture, and the arm64 runtime stage only copies
      # files, so nothing ever executes as arm64.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest is added by the action's default flavor (latest=auto), which
          # skips pre-releases. An explicit type=raw,value=latest would also move
          # latest onto a v0.2.0-rc.1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The image alone leaves nothing on the repository page. A GitHub release
  # gives the tag a changelog and says where the image is.
  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          image="ghcr.io/${REPO}:${TAG#v}"
          gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes $flags \
            --notes "Container image for linux/amd64 and linux/arm64:

          \`\`\`
          docker pull ${image}
          \`\`\`"
