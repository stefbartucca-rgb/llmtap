global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # The collector re-exposes everything llmtap pushed to it.
  - job_name: llmtap
    # OpenMetrics is required for exemplars to survive the scrape.
    scrape_protocols:
      - OpenMetricsText1.0.0
      - OpenMetricsText0.0.1
      - PrometheusText0.0.4
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
