# The whole stack: llmtap plus somewhere for its telemetry to land.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Then point a client at http://localhost:8080/v1 and open Grafana on :3000.
name: llmtap

services:
  llmtap:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      LLMTAP_OTLP_ENDPOINT: otel-collector:4318
      LLMTAP_OTLP_INSECURE: "true"
      LLMTAP_LOG_LEVEL: info
      # Upstreams can be overridden to point at Azure, a gateway, or a local
      # model server that speaks either API.
      LLMTAP_OPENAI_BASE_URL: https://api.openai.com
      LLMTAP_ANTHROPIC_BASE_URL: https://api.anthropic.com
    depends_on:
      - otel-collector
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP/gRPC, for anything else you want to send here
      - "4318:4318" # OTLP/HTTP, which is what llmtap uses
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Exemplars are what turn a spike in a Grafana panel into a link to the
      # trace that caused it. Without this feature flag they are discarded.
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      # A local, disposable stack: no login prompt in the way of the demo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
